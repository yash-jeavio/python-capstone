services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hn_user
      POSTGRES_PASSWORD: hn_password
      POSTGRES_DB: hn_capstone
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - hn_db_data:/var/lib/postgresql/data

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: hn_user
      POSTGRES_PASSWORD: hn_password
      POSTGRES_DB: hn_capstone_test
    ports:
      - "127.0.0.1:5434:5432"
    # no volume — disposable, wiped every time the container is recreated

volumes:
  hn_db_data:
